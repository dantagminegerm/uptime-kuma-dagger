# Layer 2 — observability: Prometheus + Grafana and the exporters they need.
# Deployed by `dagger call deploy-monitoring`.
#
# Configuration files are baked into locally built images (see ./prometheus)
# instead of bind-mounted: compose runs inside a Dagger container and talks to
# the host daemon over the proxied socket, so repo-relative bind mounts would
# resolve against the host filesystem, not this checkout.
name: uptime-monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    build: ./prometheus
    image: uptime-platform/prometheus:local
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [default, observability]
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    secrets:
      - source: grafana_admin_password
        uid: "472"
        mode: 0400
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [default, observability]
    logging: *logging

  # Host metrics: CPU, memory, disk, network, load.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containerd/.+)($$|/)
    volumes:
      - /:/host:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [observability]
    logging: *logging

  # Per-container resource usage (CPU, memory, network, fs).
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=percpu,sched,tcp,udp,hugetlb,referenced_memory,cpu_topology,resctrl,process,advtcp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [observability]
    logging: *logging

  # MariaDB server metrics (mysql_up, connections, queries, InnoDB…).
  # Uses a least-privilege `exporter` account that deploy-app maintains.
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.20.0
    restart: unless-stopped
    command:
      - --mysqld.address=mariadb:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MARIADB_EXPORTER_PASSWORD:?MARIADB_EXPORTER_PASSWORD is required}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9104/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [observability]
    logging: *logging

  # Availability and latency of web services (HTTP) and the DB port (TCP).
  # The image's default config already provides http_2xx and tcp_connect.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9115/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [observability]
    logging: *logging

secrets:
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD

volumes:
  prometheus-data:
  grafana-data:

networks:
  default:
  # Shared with the application layer; created (internal) by Dagger.
  observability:
    name: platform-observability
    external: true
