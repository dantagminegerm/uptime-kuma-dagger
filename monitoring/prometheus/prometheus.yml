global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: uptime-kuma-local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: docker-host

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: mariadb
    static_configs:
      - targets: ["mysqld-exporter:9104"]
        labels:
          instance: mariadb

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # HTTP availability + latency of the web services.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://uptime-kuma:3001"]
        labels: { service: uptime-kuma }
      - targets: ["http://grafana:3000/api/health"]
        labels: { service: grafana }
      - targets: ["http://prometheus:9090/-/healthy"]
        labels: { service: prometheus }
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # TCP reachability of MariaDB.
  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["mariadb:3306"]
        labels: { service: mariadb }
    relabel_configs: *blackbox_relabel
